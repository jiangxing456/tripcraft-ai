[project]
name = "tripcraft"
version = "0.1.0"
description = "LangGraph travel planner with MCP tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "cuid2>=2.0.1",
    "exa-py>=1.13.1",
    "fast-flights>=2.2",
    "fastapi>=0.115.12",
    "langchain>=1,<2",
    "langchain-mcp-adapters>=0.2,<0.3",
    "langchain-openai>=1,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "loguru>=0.7.3",
    "mcp>=1,<2",
    "psycopg[binary,pool]>=3,<4",
    "pydantic>=2.11.5",
    "python-dotenv>=1.1.0",
    "redis>=6,<8",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
